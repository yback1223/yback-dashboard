server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    
    # 1. 기본 진입점을 my_index.html로 변경
    index my_index.html;

    # [수정] 백엔드에서 생성한 동적 이미지 서빙
    # ^~ 를 붙여야 아래의 정규식 블록(.png 등)보다 우선권을 갖는다.
    location ^~ /assets/images/ {
        alias /app/assets/images/; 
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires off;
        # 파일이 없으면 정직하게 404를 내뱉어야 함 (거짓말 금지)
        log_not_found off;
    }

    # 2. API 및 Swagger (기존 유지)
    location ^~ /swagger-ui {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location ^~ /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # 3. 프론트엔드 정적 자산(Flutter 빌드 결과물) - 캐시 박멸
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires off;
        log_not_found off;
    }

    # 4. HTML 및 진입점 설정
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires off;
        
        # 파일이 진짜 없을 때 my_index.html로 보냄 (SPA 라우팅 지원)
        try_files $uri $uri/ /my_index.html;
    }
}