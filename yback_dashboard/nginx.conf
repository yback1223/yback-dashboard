server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    
    # [수정] 다시 기본값으로 복구
    index index.html;

    # 1. 백엔드 동적 이미지 (기존 유지)
    location ^~ /assets/images/ {
        alias /app/assets/images/; 
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires off;
    }

    # 2. API 및 Swagger (기존 유지)
    location ^~ /swagger-ui { proxy_pass http://backend:8080; proxy_set_header Host $host; }
    location ^~ /v3/api-docs { proxy_pass http://backend:8080; proxy_set_header Host $host; }
    location /api { proxy_pass http://backend:8080; proxy_set_header Host $host; }

    # 3. 프론트엔드 정적 자산 (JS, CSS 등 - 타임스탬프 파일들)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires off;
    }

    # 4. [수정] HTML 진입점 설정
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires off;

        add_header X-Accel-Expires 0;
        
        # [핵심] 다시 index.html로 변경
        try_files $uri $uri/ /index.html;
    }
}